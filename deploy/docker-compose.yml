# Запуск на сервере: docker compose up -d  (рядом должен лежать .env)
services:
  web:
    image: ghcr.io/http-core/aiprint-landing:latest
    restart: unless-stopped
    # только localhost: снаружи сайт доступен через nginx
    ports:
      - "127.0.0.1:4321:4321"
    env_file: .env
    environment:
      TRUST_PROXY: "1" # IP клиента берётся из X-Forwarded-For от nginx (для лимита заявок)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

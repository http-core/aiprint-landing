# /etc/nginx/sites-available/aiprint  →  ln -s в sites-enabled, затем: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d example.ru -d www.example.ru  (допишет ssl-директивы и редирект сам)

server {
  listen 80;
  listen [::]:80;
  server_name example.ru www.example.ru;

  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Файлы с хешем в имени — кэшируем навсегда
  location /_astro/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# conf/aifotobudka.conf — лендинг aifotobudka.ru (контейнер landing:4321 из того же compose)

server {
    listen 80;
    server_name aifotobudka.ru www.aifotobudka.ru;
    location / {
        return 301 https://aifotobudka.ru$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl;
    server_name www.aifotobudka.ru;

    ssl_certificate     /etc/letsencrypt/live/aifotobudka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifotobudka.ru/privkey.pem;

    return 301 https://aifotobudka.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name aifotobudka.ru;

    ssl_certificate     /etc/letsencrypt/live/aifotobudka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifotobudka.ru/privkey.pem;

    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Имя контейнера резолвится при запросе, а не при старте nginx:
    # если лендинг упал или перезапускается, nginx и остальные сайты продолжают работать.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $landing http://landing:4321;

    # Файлы с хешем в имени — кэшируем навсегда
    location /_astro/ {
        proxy_pass $landing;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: клиент не сможет подделать IP
        # и обойти лимит заявок (приложение берёт первый адрес из заголовка)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
